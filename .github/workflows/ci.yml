name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        # The scraper fixture tests replay recorded responses, so the suite
        # needs no network access and catches parsing regressions offline.
        run: pytest tests/ -q

      - name: Lint
        run: flake8 ka_events --count --max-line-length=120 --statistics

